<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap (recommended so .form-control etc. actually work) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Your CSS -->
    <link rel="stylesheet" th:href="@{/css/demo.css}">

    <title>Product Form</title>
</head>

<body>
<div class="container mt-4">

    <h1 class="mb-4">Product Detail</h1>

    <form th:action="@{/showFormAddProduct}" th:object="${product}" method="POST">

        <!-- Global errors (your Part H message will show here) -->
        <div th:if="${#fields.hasGlobalErrors()}" class="mb-3">
            <p th:each="err : ${#fields.globalErrors()}"
               th:text="${err}"
               class="text-danger mb-1"></p>
        </div>

        <input type="hidden" th:field="*{id}"/>

        <div class="mb-3 col-4">
            <label class="form-label">
                Name
            </label>
            <input type="text" th:field="*{name}" class="form-control"/>
        </div>

        <div class="mb-3 col-4">
            <label class="form-label">
                Price
            </label>
            <input type="number" step="0.01" th:field="*{price}" class="form-control"/>
        </div>

        <div class="mb-3 col-4">
            <label class="form-label">
                Inventory
            </label>
            <input type="number" th:field="*{inv}" class="form-control"/>
        </div>


        <!-- Field errors (optional; keeps your existing idea but valid HTML) -->
        <div th:if="${#fields.hasAnyErrors()}" class="mb-3">
            <ul class="text-danger mb-0">
                <li th:each="err: ${#fields.allErrors()}" th:text="${err}"></li>
            </ul>
        </div>

        <button type="submit" class="btn btn-primary">Submit</button>
        <a th:href="@{/mainscreen}" class="btn btn-secondary ms-2">Back</a>
    </form>

    <hr class="my-4"/>

    <h2 class="mb-3">Available Parts</h2>
    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>Name</th>
            <th>Price</th>
            <th>Inventory</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="tempPart : ${availparts}">
            <td th:text="${tempPart.name}">1</td>
            <td th:text="${tempPart.price}">1</td>
            <td th:text="${tempPart.inv}">1</td>
            <td>
                <a th:href="@{/associatepart(partID=${tempPart.id})}"
                   class="btn btn-primary btn-sm">Add</a>
            </td>
        </tr>
        </tbody>
    </table>

    <h2 class="mb-3 mt-4">Associated Parts</h2>
    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>Name</th>
            <th>Price</th>
            <th>Inventory</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="tempPart : ${assparts}">
            <td th:text="${tempPart.name}">1</td>
            <td th:text="${tempPart.price}">1</td>
            <td th:text="${tempPart.inv}">1</td>
            <td>
                <a th:href="@{/removepart(partID=${tempPart.id})}"
                   class="btn btn-primary btn-sm">Remove</a>
            </td>
        </tr>
        </tbody>
    </table>

</div>
</body>
</html>
