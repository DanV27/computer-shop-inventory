<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Outsourced Part Form</title>

    <!-- Bootstrap so form-control/buttons look right -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Your custom styles -->
    <link rel="stylesheet" th:href="@{/css/demo.css}">
</head>

<body>

<!-- Full-width header bar -->
<header class="site-header">
    <div class="header-content">
        <h1 class="mb-0">Outsourced Part Detail</h1>
    </div>
</header>

<div class="container mt-4">

    <form th:action="@{/showFormAddOutPart}" th:object="${outsourcedpart}" method="POST">

        <!-- Global errors -->
        <div th:if="${#fields.hasGlobalErrors()}" class="mb-3">
            <p th:each="err : ${#fields.globalErrors()}"
               th:text="${err}"
               class="text-danger mb-1"></p>
        </div>

        <input type="hidden" th:field="*{id}"/>

        <div class="mb-3 col-4">
            <label class="form-label">Name</label>
            <input type="text" th:field="*{name}" class="form-control"/>
        </div>

        <div class="mb-3 col-4">
            <label class="form-label">Price</label>
            <input type="number" step="0.01" th:field="*{price}" class="form-control"/>
            <div class="text-danger" th:if="${#fields.hasErrors('price')}" th:errors="*{price}">Price Error</div>
        </div>

        <div class="mb-3 col-4">
            <label class="form-label">Inventory</label>
            <input type="number" th:field="*{inv}" class="form-control"/>
            <div class="text-danger" th:if="${#fields.hasErrors('inv')}" th:errors="*{inv}">Inventory Error</div>
        </div>

        <div class="mb-3 col-4">
            <label class="form-label">Min Inventory</label>
            <input type="number" th:field="*{minInv}" class="form-control"/>
            <div class="text-danger" th:if="${#fields.hasErrors('minInv')}" th:errors="*{minInv}">Min Inventory Error</div>
        </div>

        <div class="mb-3 col-4">
            <label class="form-label">Max Inventory</label>
            <input type="number" th:field="*{maxInv}" class="form-control"/>
            <div class="text-danger" th:if="${#fields.hasErrors('maxInv')}" th:errors="*{maxInv}">Max Inventory Error</div>
        </div>

        <div class="mb-3 col-4">
            <label class="form-label">Company Name</label>
            <input type="text" th:field="*{companyName}" class="form-control"/>
        </div>

        <button type="submit" class="btn btn-primary">Submit</button>
        <a th:href="@{/mainscreen}" class="btn btn-secondary ms-2">Main Screen</a>

    </form>

</div>

</body>
</html>
